<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f0e8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-logo1.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
    <title>Rubros | CRV4 Mayorista</title>
  </head>
  <body class="admin-page">
    <header class="public-header"><div class="header-start"><button class="menu-button" id="menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false"><span></span><span></span><span></span></button><a class="wordmark" href="/" aria-label="CRV4 Mayorista, inicio"><img class="app-icon-small" src="/icons/crv4-192.png" alt="CRV4" /><span><em>Mayorista</em></span></a></div><a class="nav-login" href="/login">Panel <span aria-hidden="true">→</span></a></header>
    <div class="menu-overlay" id="menu-overlay" hidden></div><aside class="side-menu" id="side-menu" aria-label="Menú lateral" aria-hidden="true"><div class="side-menu-head"><span class="eyebrow">Administración</span><button class="close-menu" id="menu-close" type="button" aria-label="Cerrar menú">×</button></div><nav class="side-nav"><a href="/">Inicio <span>→</span></a><a href="/rubros">Rubros <span>→</span></a><a href="/catalogo">Catálogo <span>→</span></a></nav></aside>
    <main class="admin-content"><div class="admin-heading"><div><p class="eyebrow">Módulo de administración</p><h1>Rubros</h1><p>Organizá las categorías que van a ordenar el catálogo público.</p></div><a class="secondary-button" href="/login">Volver al panel <span aria-hidden="true">→</span></a></div>
      <section class="admin-layout"><form class="admin-form" id="rubro-form"><div class="section-kicker">Nuevo rubro</div><label for="codigo">Código</label><input id="codigo" name="codigo" required placeholder="bijouterie" /><label for="slug">Slug</label><input id="slug" name="slug" required placeholder="bijouterie" /><label for="nombre">Nombre</label><input id="nombre" name="nombre" required placeholder="Bijouterie" /><label for="id_rubro_padre">Rubro padre</label><select id="id_rubro_padre" name="id_rubro_padre"><option value="">Sin rubro padre</option></select><label for="descripcion">Descripción</label><textarea id="descripcion" name="descripcion" rows="4" placeholder="Descripción breve del rubro"></textarea><label for="imagen">Imagen</label><input id="imagen" name="imagen" type="url" placeholder="https://..." /><label for="orden">Orden</label><input id="orden" name="orden" type="number" min="0" value="0" /><button class="primary-button" type="submit"><span>Crear rubro</span><span aria-hidden="true">→</span></button><p class="form-message" id="rubro-message" role="status" aria-live="polite"></p></form>
        <section class="admin-list"><div class="list-heading"><div><div class="section-kicker">Catálogo</div><h2>Rubros cargados</h2></div><span class="list-note">Orden de publicación</span></div><div class="table-wrap"><table><thead><tr><th>Orden</th><th>Nombre</th><th>Rubro padre</th><th>Slug</th><th>Estado</th></tr></thead><tbody id="rubros-table-body"><tr><td colspan="5" class="table-empty">Cargando rubros...</td></tr></tbody></table></div></section></section>
    </main><script src="/app.js" type="module"></script>
  </body>
</html>
